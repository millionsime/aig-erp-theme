name: Trigger server deploy
# When something is merged into the branch the server runs, ask the infra repo
# to rebuild the image and deploy it. Needs the repo secret INFRA_DISPATCH_TOKEN:
# a fine-grained token on millionsime/aig-erpnext-infra with Actions: read+write.
on:
  push:
    branches: [feature/inventory]
  workflow_dispatch:
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.INFRA_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/millionsime/aig-erpnext-infra/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}'
          echo "Deploy requested: https://github.com/millionsime/aig-erpnext-infra/actions"
